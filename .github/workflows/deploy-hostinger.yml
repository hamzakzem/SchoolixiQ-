name: Deploy Frontend to Hostinger

# Build + production reliability gates. Hostinger Deployments auto-deploy from main.
# Broken releases are blocked here before users can receive them.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Require VITE_FIREBASE_VAPID_KEY secret
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_VAPID_KEY" ]; then
            echo "::error title=Missing VITE_FIREBASE_VAPID_KEY::Set GitHub repository secret VITE_FIREBASE_VAPID_KEY before building."
            exit 1
          fi
          echo "VITE_FIREBASE_VAPID_KEY is set (length=${#VITE_FIREBASE_VAPID_KEY})."

      - name: Build production release (web + server)
        env:
          VITE_APP_URL: https://schoolixiq.com
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ANDROID_APK_URL: ${{ secrets.VITE_ANDROID_APK_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          ANDROID_APK_DOWNLOAD_URL: ${{ secrets.ANDROID_APK_DOWNLOAD_URL }}
        run: npm run build:full

      - name: Require Android APK in dist before release
        env:
          ANDROID_APK_DOWNLOAD_URL: ${{ secrets.ANDROID_APK_DOWNLOAD_URL }}
        run: npm run stage:apk:require

      - name: Verify production release artifacts
        run: npm run verify:production

      - name: Verify production server start + SPA routes
        run: npm run verify:server-start

      - name: Verify VAPID key embedded in web bundle
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -e
          shopt -s nullglob
          files=(dist/assets/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No JS bundles found in dist/assets/"
            exit 1
          fi
          found=0
          for f in "${files[@]}"; do
            if grep -Fq "$VITE_FIREBASE_VAPID_KEY" "$f"; then
              found=1
              echo "VAPID key found in $f"
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error title=VAPID key missing from bundle::Build did not embed VITE_FIREBASE_VAPID_KEY in dist/assets/*.js"
            exit 1
          fi

      - name: Verify no legacy Google auth in web bundle
        run: |
          set -e
          for pattern in 'iframerpc' 'idpiframe' 'platform.js' 'gapi.auth2' 'gsi/client' 'signInWithRedirect' '@codetrix-studio/capacitor-google-auth'; do
            if grep -rq "$pattern" dist/assets/ 2>/dev/null; then
              echo "::error::Legacy Google auth pattern found in dist: $pattern"
              grep -rl "$pattern" dist/assets/ || true
              exit 1
            fi
          done
          echo "No deprecated Google Identity / Capacitor web fallback patterns in dist/assets/"

      - name: Verify Node Web App dist output
        run: |
          set -e
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/server.mjs
          test -f dist/firebase-applet-config.json
          test -d dist/assets
          ls -la dist/
          ls -lh dist/server.mjs
          if test -f dist/downloads/schoolixiq.apk; then
            echo "APK present in dist/downloads/schoolixiq.apk"
            ls -lh dist/downloads/schoolixiq.apk
          else
            echo "::error::dist/downloads/schoolixiq.apk missing — set GitHub secret ANDROID_APK_DOWNLOAD_URL or place public/downloads/schoolixiq.apk before build"
            exit 1
          fi

      - name: Package dist zip (manual fallback)
        run: |
          cd dist && zip -r ../schoolixiq-dist.zip . && cd ..
          ls -la schoolixiq-dist.zip

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: schoolixiq-dist
          path: schoolixiq-dist.zip
          retention-days: 7

      - name: Build summary
        run: |
          echo "### Production build/verify gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`npm run build:full\` (web + Node server)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`npm run verify:production\` (dist + server.mjs + chunks)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`npm run verify:server-start\` (boot + SPA routes)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact \`schoolixiq-dist\` retained for 7 days." >> "$GITHUB_STEP_SUMMARY"

  production-health:
    name: Live production health
    needs: build-verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Warm-up wait for Hostinger cutover
        env:
          PRODUCTION_HEALTH_WAIT_SEC: ${{ vars.PRODUCTION_HEALTH_WAIT_SEC }}
        run: |
          # Hostinger Node restart / atomic cutover often needs more than 90s.
          WAIT="${PRODUCTION_HEALTH_WAIT_SEC:-180}"
          if ! [[ "$WAIT" =~ ^[0-9]+$ ]]; then WAIT=180; fi
          echo "Warm-up: waiting ${WAIT}s before first live probe (Hostinger deploy/restart window)..."
          sleep "$WAIT"
          echo "Warm-up complete. Starting health probes."

      - name: Probe homepage + login (HTTP 200/3xx with retries)
        env:
          PRODUCTION_HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          set -u
          BASE="${PRODUCTION_HEALTH_URL:-https://schoolixiq.com}"
          BASE="${BASE%/}"
          ROUTES="/ /login"
          MAX_ATTEMPTS=10
          RETRY_DELAY_SEC=15
          CONNECT_TIMEOUT=20
          MAX_TIME=45

          echo "Health base URL: ${BASE}"
          echo "Routes: ${ROUTES}"
          echo "Attempts: ${MAX_ATTEMPTS} | Retry delay: ${RETRY_DELAY_SEC}s"
          echo "Accept: HTTP 200–399 (connection errors / 5xx retry)"
          echo ""

          is_success_status() {
            local code="$1"
            [[ "$code" =~ ^[23][0-9][0-9]$ ]]
          }

          probe_route() {
            local path="$1"
            local url="${BASE}${path}"
            local attempt=1
            local http_code=""
            local curl_exit=0
            local last_err=""

            echo "=== Probe ${url} ==="

            while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
              echo "[attempt ${attempt}/${MAX_ATTEMPTS}] GET ${url}"
              set +e
              http_code="$(curl -sS -o /dev/null -w '%{http_code}' \
                --connect-timeout "$CONNECT_TIMEOUT" \
                --max-time "$MAX_TIME" \
                -L \
                -A 'SchoolixIQ-CI-Health/1.0' \
                -H 'Accept: text/html,application/xhtml+xml' \
                "$url" 2>/tmp/health-curl.err)"
              curl_exit=$?
              set -e

              if [ "$curl_exit" -ne 0 ]; then
                last_err="$(tr -d '\r' </tmp/health-curl.err | head -c 300)"
                echo "  result: curl_exit=${curl_exit} (temporary/network) ${last_err}"
              else
                echo "  result: HTTP ${http_code}"
                if is_success_status "$http_code"; then
                  echo "OK: ${url} -> HTTP ${http_code}"
                  return 0
                fi
                last_err="HTTP ${http_code}"
              fi

              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                echo "  retrying in ${RETRY_DELAY_SEC}s (Hostinger may still be restarting)..."
                sleep "$RETRY_DELAY_SEC"
              fi
              attempt=$((attempt + 1))
            done

            echo "::error::FAIL: ${url} after ${MAX_ATTEMPTS} attempts — last=${last_err:-unknown}"
            return 1
          }

          failed=0
          for path in $ROUTES; do
            if ! probe_route "$path"; then
              failed=1
            fi
            echo ""
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Live production health failed after warm-up + retries"
            echo "Check Hostinger Runtime Logs for SERVER_READY / PORT_LISTENING."
            exit 1
          fi

          echo "OK: live production health passed (all routes HTTP 200/3xx)"
          {
            echo "### Live production health"
            echo "- Warm-up wait completed"
            echo "- Probed \`${BASE}/\` and \`${BASE}/login\`"
            echo "- Accepted HTTP 200–399 with up to ${MAX_ATTEMPTS} attempts / ${RETRY_DELAY_SEC}s delay"
          } >> "$GITHUB_STEP_SUMMARY"
