name: Deploy Frontend to Hostinger

# Production deploy currently handled by Hostinger Deployments auto-deploy from main.
# SFTP disabled until remote path is verified.
# This workflow is a build/verify gate only (VAPID + dist integrity).
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Require VITE_FIREBASE_VAPID_KEY secret
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          if [ -z "$VITE_FIREBASE_VAPID_KEY" ]; then
            echo "::error title=Missing VITE_FIREBASE_VAPID_KEY::Set GitHub repository secret VITE_FIREBASE_VAPID_KEY before building."
            exit 1
          fi
          echo "VITE_FIREBASE_VAPID_KEY is set (length=${#VITE_FIREBASE_VAPID_KEY})."

      - name: Build frontend (static only)
        env:
          VITE_APP_URL: https://schoolixiq.com
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
          VITE_ANDROID_APK_URL: ${{ secrets.VITE_ANDROID_APK_URL }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:web

      - name: Verify VAPID key embedded in web bundle
        env:
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}
        run: |
          set -e
          shopt -s nullglob
          files=(dist/assets/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No JS bundles found in dist/assets/"
            exit 1
          fi
          found=0
          for f in "${files[@]}"; do
            if grep -Fq "$VITE_FIREBASE_VAPID_KEY" "$f"; then
              found=1
              echo "VAPID key found in $f"
              break
            fi
          done
          if [ "$found" -ne 1 ]; then
            echo "::error title=VAPID key missing from bundle::Build did not embed VITE_FIREBASE_VAPID_KEY in dist/assets/*.js"
            exit 1
          fi

      - name: Require Android APK in dist before deploy
        env:
          ANDROID_APK_DOWNLOAD_URL: ${{ secrets.ANDROID_APK_DOWNLOAD_URL }}
        run: npm run stage:apk:require

      - name: Verify web build integrity
        run: npm run verify:web-build

      - name: Verify no legacy Google auth in web bundle
        run: |
          set -e
          for pattern in 'iframerpc' 'idpiframe' 'platform.js' 'gapi.auth2' 'gsi/client' 'signInWithRedirect' '@codetrix-studio/capacitor-google-auth'; do
            if grep -rq "$pattern" dist/assets/ 2>/dev/null; then
              echo "::error::Legacy Google auth pattern found in dist: $pattern"
              grep -rl "$pattern" dist/assets/ || true
              exit 1
            fi
          done
          echo "No deprecated Google Identity / Capacitor web fallback patterns in dist/assets/"

      - name: Verify dist output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          rm -f dist/server.mjs dist/server.cjs dist/server.cjs.map 2>/dev/null || true
          ls -la dist/
          if test -f dist/downloads/schoolixiq.apk; then
            echo "APK present in dist/downloads/schoolixiq.apk"
            ls -lh dist/downloads/schoolixiq.apk
          else
            echo "::error::dist/downloads/schoolixiq.apk missing — set GitHub secret ANDROID_APK_DOWNLOAD_URL (direct HTTPS APK URL) or place public/downloads/schoolixiq.apk before build"
            exit 1
          fi

      - name: Package dist zip (manual fallback)
        run: |
          cd dist && zip -r ../schoolixiq-dist.zip . && cd ..
          ls -la schoolixiq-dist.zip

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolixiq-dist
          path: schoolixiq-dist.zip
          retention-days: 7

      # Production deploy currently handled by Hostinger Deployments auto-deploy from main.
      # SFTP disabled until HOSTINGER_FTP_REMOTE_DIR is verified in hPanel.
      # - name: Install lftp
      # - name: Test Hostinger SFTP port
      # - name: Deploy to Hostinger (SFTP)

      - name: Build summary
        run: |
          echo "### Frontend build/verify gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Build and verification passed. Production deploy is handled by **Hostinger Deployments** (auto-deploy from \`main\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "SFTP upload is disabled until \`HOSTINGER_FTP_REMOTE_DIR\` is confirmed." >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact \`schoolixiq-dist\` retained for 7 days if manual upload is needed." >> "$GITHUB_STEP_SUMMARY"
